<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Из грязи в князи</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="startScreen" class="start-screen">
  <div class="start-card">
    <h1>Из грязи<br>в князи</h1>
    <p>Ты проснулся на улице. Ни денег, ни дома, ни будущего.<br>Но у тебя есть руки и голова.</p>
    <div class="start-buttons">
      <button class="btn btn-primary" id="btnNewGame">▶ Новая игра</button>
      <button class="btn btn-secondary" id="btnContinue" style="display:none">💾 Продолжить</button>
    </div>
  </div>
</div>

<div id="game" class="game hidden">
  <!-- HUD -->
  <header class="hud">
    <div class="hud-money">₽<span id="hudMoney">0</span></div>
    <div class="hud-stats">
      <div class="stat"><div class="stat-ico" id="icoSatiety"></div><div class="bar"><div class="bar-fill" id="barSatiety"></div></div></div>
      <div class="stat"><div class="stat-ico" id="icoHealth"></div><div class="bar"><div class="bar-fill" id="barHealth"></div></div></div>
      <div class="stat"><div class="stat-ico" id="icoEnergy"></div><div class="bar"><div class="bar-fill" id="barEnergy"></div></div></div>
      <div class="stat"><div class="stat-ico" id="icoHygiene"></div><div class="bar"><div class="bar-fill" id="barHygiene"></div></div></div>
      <div class="stat"><div class="stat-ico" id="icoRep"></div><div class="bar"><div class="bar-fill" id="barReputation"></div></div></div>
    </div>
    <div class="hud-time">
      <div id="hudTimeIcon"></div>
      <div id="hudTimeText">08:00</div>
    </div>
  </header>

  <!-- Карта = главный экран -->
  <main class="map-screen" id="mapScreen">
    <div class="map-viewport">
      <canvas id="mapCanvas" width="1200" height="800"></canvas>
      <div class="time-overlay" id="timeOverlay"></div>
      <div id="mapLocations"></div>
      <div id="mapPlayer" class="map-player"></div>
    </div>
  </main>

  <!-- Нижняя навигация -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="navMap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
      <span>Карта</span>
    </button>
    <button class="nav-btn" id="navInv">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <span>Сумка</span>
    </button>
    <button class="nav-btn" id="navChar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
      <span>Я</span>
    </button>
    <button class="nav-btn" id="navQuests">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Квесты</span>
    </button>
    <button class="nav-btn" id="navSettings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Настройки</span>
    </button>
  </nav>
</div>

<!-- Туториал -->
<div id="tutorialToast" class="tutorial-toast hidden">
  <div class="tut-icon">💡</div>
  <div class="tut-text" id="tutText">...</div>
  <button class="tut-close" id="tutClose">×</button>
</div>

<div id="toastArea" class="toast-area"></div>
<div id="modalRoot"></div>

<script src="game.js"></script>
</body>
</html>
